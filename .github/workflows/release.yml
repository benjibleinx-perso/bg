# Fabrique BG.exe et le publie en release GitHub.
#
# POURQUOI CE FICHIER EXISTE.
#
# Un ami a qui l'on ouvre le depot n'a aucune raison d'installer Godot,
# Blender, Python, ffmpeg et git-lfs pour jouer vingt minutes. Il l'a fait, et
# c'est notre faute : rien ne lui proposait autre chose.
#
# Desormais, POUSSER UNE ETIQUETTE SUFFIT :
#
#     git tag v0.31.0 && git push origin v0.31.0
#
# GitHub fabrique l'executable et l'attache a une release. Celui qui veut jouer
# telecharge un fichier, double-clique, et c'est tout. Rien a installer, rien a
# cloner, pas de compte.
#
# L'export tourne sur un runner Windows parce que la cible EST Windows. Godot
# sait exporter d'une plateforme vers une autre, mais le modele d'export
# Windows produit alors un binaire qu'aucun de nous ne pourrait tester avant
# publication.
name: release

on:
  push:
    tags:
      - "v*"
  # Bouton manuel dans l'onglet Actions : utile pour verifier que la chaine
  # marche encore sans avoir a inventer une version.
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT: "4.7.1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PAS de « lfs: true » ici, et ce n'est pas un oubli.
          #
          # Cette option tire les 556 objets LFS du depot — 300 Mo — A CHAQUE
          # RUN. Trente-neuf runs ont suffi a bruler 11,8 Go des 10 Go de bande
          # passante LFS que le compte inclut, et GitHub a facture le
          # depassement le 01/09/2026.
          #
          # On arrive donc avec les pointeurs, et les trois etapes qui suivent
          # ne telechargent que ce que l'export utilise vraiment.
          lfs: false

      - name: Empreinte des assets du jeu
        shell: pwsh
        run: |
          # La cle du cache doit changer quand un ASSET change, et SEULEMENT a
          # ce moment-la. Hacher game/** l'invaliderait a chaque ligne de code
          # modifiee ; on hache donc la liste des empreintes LFS, qui ne bouge
          # que si un binaire bouge.
          git lfs ls-files -l -I "game/**" |
            ForEach-Object { ($_ -split ' ')[0] } |
            Sort-Object | Set-Content .empreintes-lfs -Encoding UTF8

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-game-${{ hashFiles('.empreintes-lfs') }}
          # Sans cette ligne, un seul son ajoute ferait retelecharger les
          # 112 Mo. Avec elle on repart du cache precedent, et le « lfs pull »
          # ci-dessous ne va chercher que les objets qui manquent vraiment.
          # La bande passante du cache Actions ne compte pas dans le quota LFS.
          restore-keys: lfs-game-

      - name: Les assets que l export utilise
        shell: pwsh
        run: |
          # game/** et rien d'autre. livraisons/ — modeles bruts, voix
          # d'origine, sons a trier — pese 200 Mo et n'entre jamais dans le
          # jeu : les deux seules mentions de ce dossier sous game/ sont des
          # commentaires. Le telecharger a chaque build, c'etait les deux tiers
          # de la facture.
          git lfs pull --include="game/**"

          # ET ON VERIFIE, parce que c'est exactement ici que le silence coute
          # cher : un pointeur qui reste un pointeur — quota atteint, reseau,
          # filtre trop etroit — donne un fichier texte de quelques octets a la
          # place d'un modele, et l'export sort un jeu VIDE sans une erreur.
          # « - » en deuxieme colonne = objet absent du disque.
          $manquants = git lfs ls-files -I "game/**" |
            Where-Object { $_ -match '^\S+\s+-\s' }
          if ($manquants) {
            $manquants | Select-Object -First 10 | Write-Host
            throw "$($manquants.Count) assets LFS non telecharges : l export serait vide"
          }

      - name: Godot et ses modeles d'export
        shell: pwsh
        run: |
          $base = "https://github.com/godotengine/godot/releases/download/$env:GODOT-stable"
          Invoke-WebRequest "$base/Godot_v$env:GODOT-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          Invoke-WebRequest "$base/Godot_v$env:GODOT-stable_export_templates.tpz" -OutFile tpl.tpz
          Expand-Archive tpl.tpz -DestinationPath tpl
          $cible = "$env:APPDATA\Godot\export_templates\$env:GODOT.stable"
          New-Item -ItemType Directory -Force -Path $cible | Out-Null
          Copy-Item tpl\templates\* -Destination $cible -Recurse -Force

      - name: Numero de version
        shell: pwsh
        run: |
          # La version vit dans project.godot, et nulle part ailleurs. On la
          # LIT plutot que de la deduire de l'etiquette : si les deux
          # divergent, c'est le jeu qui a raison, et on veut le savoir.
          $v = (Select-String -Path game/project.godot -Pattern '^config/version="(.+)"').Matches[0].Groups[1].Value
          "VERSION=$v" >> $env:GITHUB_ENV
          $sha = "$env:GITHUB_SHA".Substring(0, 7)
          @{ version = $v; build = $sha } | ConvertTo-Json |
            Set-Content game/donnees/version.json -Encoding UTF8

      - name: Import des ressources
        shell: pwsh
        run: |
          # Un premier lancement sans fenetre construit le cache d'import.
          # Sans lui, l'export part d'un projet dont Godot n'a jamais lu les
          # assets et sort un jeu sans textures.
          $godot = (Get-ChildItem godot -Filter "*_console.exe" -Recurse |
                    Select-Object -First 1).FullName
          if (-not $godot) {
            $godot = (Get-ChildItem godot -Filter "*.exe" -Recurse |
                      Select-Object -First 1).FullName
          }
          "GODOT_EXE=$godot" >> $env:GITHUB_ENV
          & $godot --headless --path game --import
        continue-on-error: true

      - name: Export Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          & $env:GODOT_EXE --headless --path game --export-release "Windows"
          if (-not (Test-Path build/BG.exe)) {
            throw "l export n a rien produit"
          }
          $mo = [math]::Round((Get-Item build/BG.exe).Length / 1MB, 1)
          Write-Host "BG.exe : $mo Mo, version $env:VERSION"

      - name: L archive a telecharger
        shell: pwsh
        run: |
          # On joint aussi les notes de version : celui qui telecharge doit
          # savoir ce qu'il peut essayer sans avoir a ouvrir le depot.
          Copy-Item NOTES-DE-VERSION.md build/
          Compress-Archive -Path build/* -DestinationPath "BG-$env:VERSION-windows.zip" -Force

      - name: Le texte de la release
        shell: pwsh
        run: |
          # SEULEMENT LA SECTION DE CETTE VERSION, pas tout le fichier.
          #
          # NOTES-DE-VERSION.md contient tout l'historique. Le coller en entier
          # dans le corps de la release enterrait le bouton de telechargement
          # sous cinq cents lignes : la section « Assets » de GitHub est en bas
          # de page, et personne ne l'a trouvee.
          #
          # On extrait donc de « ## <version> » jusqu'au titre suivant, et on
          # met le lien de telechargement EN PREMIER.
          $notes = Get-Content NOTES-DE-VERSION.md -Raw
          $motif = "(?ms)^## $([regex]::Escape($env:VERSION))\b.*?(?=^## |\z)"
          $section = [regex]::Match($notes, $motif).Value.Trim()
          if (-not $section) { $section = "Voir NOTES-DE-VERSION.md." }
          $zip = "BG-$env:VERSION-windows.zip"
          $lien = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/v$env:VERSION/$zip"
          # PAS DE HERE-STRING ICI, et c'est une contrainte reelle : PowerShell
          # exige que le « "@ » de fermeture soit en colonne zero, alors qu'un
          # bloc YAML « run: | » se termine des qu'une ligne revient en colonne
          # zero. Les deux regles s'excluent. Le fichier devenait invalide, et
          # GitHub echouait en zero seconde sur CHAQUE push, y compris ceux qui
          # n'avaient rien a voir avec une release.
          $corps = @(
            "## [Telecharger le jeu (Windows)]($lien)",
            "",
            "Un zip, un exe dedans, double-clic. Rien a installer.",
            "",
            "Windows dira « editeur inconnu » : l'executable n'est pas signe.",
            "**Informations complementaires -> Executer quand meme.**",
            "",
            "---",
            "",
            $section
          )
          $corps -join "`n" | Set-Content release-body.md -Encoding UTF8

      - uses: actions/upload-artifact@v4
        with:
          name: BG-windows
          path: BG-*.zip

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: BG ${{ env.VERSION }}
          body_path: release-body.md
          files: BG-*.zip
